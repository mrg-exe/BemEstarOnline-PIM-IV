<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produto | Bem Estar Online</title>
  <meta name="description" content="Detalhes do produto.">
  <link rel="icon" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
  <script>
    // Aplica letra/contraste/tema antes de desenhar a página (evita "piscar").
    try { var p = JSON.parse(localStorage.getItem('beo_acessibilidade') || '{}'), r = document.documentElement;
      if (p.fonte) r.dataset.fonte = p.fonte; if (p.contraste === 'alto') r.dataset.contraste = 'alto';
      if (p.tema && p.tema !== 'auto') r.dataset.tema = p.tema; } catch (e) {}
  </script>
</head>
<body>
  <div id="cabecalho"></div>
  <main id="conteudo" tabindex="-1">

    <div class="conteiner">
      <nav class="trilha" aria-label="Você está em"><ol id="trilha"><li><a href="index.html">Início</a></li></ol></nav>
      <div id="produto"><p class="carregando" role="status">Carregando produto...</p></div>
      <section class="secao" id="relacionados-secao" hidden aria-labelledby="titulo-relacionados">
        <h2 id="titulo-relacionados">Quem levou este também viu</h2>
        <ul class="grade-produtos" id="relacionados"></ul>
      </section>
    </div>
  </main>
  <div id="rodape"></div>
  <script src="js/config.js"></script>
  <script src="js/catalogo-local.js"></script>
  <script src="js/app.js"></script>
  <script src="js/paginas/produto.js"></script>
</body>
</html>
