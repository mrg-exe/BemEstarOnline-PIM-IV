<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Esqueci minha senha | Bem Estar Online</title>
  <meta name="description" content="Receba por e-mail um link para criar uma nova senha.">
  <link rel="icon" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
  <script>
    // Aplica letra/contraste/tema antes de desenhar a página (evita "piscar").
    try { var p = JSON.parse(localStorage.getItem('beo_acessibilidade') || '{}'), r = document.documentElement;
      if (p.fonte) r.dataset.fonte = p.fonte; if (p.contraste === 'alto') r.dataset.contraste = 'alto';
      if (p.tema && p.tema !== 'auto') r.dataset.tema = p.tema; } catch (e) {}
  </script>
</head>
<body>
  <div id="cabecalho"></div>
  <main id="conteudo" tabindex="-1">

    <div class="pagina-estreita">
      <div class="cartao">
        <h1 style="font-size:1.9rem">Esqueci minha senha</h1>
        <p>Digite o e-mail da sua conta. Vamos mandar um link para você criar uma senha nova.
           O link vale por 30 minutos e funciona uma vez só.</p>
        <form id="form-esqueci" novalidate>
          <div class="campo">
            <label for="email">E-mail</label>
            <input class="entrada" id="email" type="email" autocomplete="email" required>
          </div>
          <button class="botao botao--largo" type="submit">Enviar o link</button>
        </form>
        <div id="resultado-esqueci" role="status"></div>
        <p style="margin-top:1.25rem"><a href="login.html">Voltar para o login</a></p>
      </div>
    </div>  </main>
  <div id="rodape"></div>
  <script src="js/config.js"></script>
  <script src="js/catalogo-local.js"></script>
  <script src="js/app.js"></script>
  <script src="js/paginas/esqueci-senha.js"></script>
</body>
</html>
