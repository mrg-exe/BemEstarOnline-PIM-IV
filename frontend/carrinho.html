<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrinho | Bem Estar Online</title>
  <meta name="description" content="Seu carrinho de compras.">
  <link rel="icon" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
  <script>
    // Aplica letra/contraste/tema antes de desenhar a página (evita "piscar").
    try { var p = JSON.parse(localStorage.getItem('beo_acessibilidade') || '{}'), r = document.documentElement;
      if (p.fonte) r.dataset.fonte = p.fonte; if (p.contraste === 'alto') r.dataset.contraste = 'alto';
      if (p.tema && p.tema !== 'auto') r.dataset.tema = p.tema; } catch (e) {}
  </script>
</head>
<body>
  <div id="cabecalho"></div>
  <main id="conteudo" tabindex="-1">

    <div class="conteiner layout-carrinho">
      <section aria-labelledby="titulo-carrinho">
        <h1 id="titulo-carrinho">Seu carrinho</h1>
        <div id="itens"></div>
        <div id="checkout"></div>
      </section>
      <aside class="resumo" aria-labelledby="titulo-resumo">
        <h2 id="titulo-resumo">Resumo</h2>
        <div id="valores"></div>
        <div class="etapa-checkout">
          <label for="cupom" class="rotulo"><strong>Cupom de desconto</strong></label>
          <div class="cupom-linha" style="margin-top:.4rem">
            <input id="cupom" class="entrada" autocomplete="off" placeholder="Ex.: BEMESTAR10">
            <button class="botao botao--contorno" type="button" id="aplicar-cupom">Aplicar</button>
          </div>
          <p id="mensagem-cupom" role="status" style="margin:.4rem 0 0"></p>
        </div>
      </aside>
    </div>
  </main>
  <div id="rodape"></div>
  <script src="js/config.js"></script>
  <script src="js/catalogo-local.js"></script>
  <script src="js/app.js"></script>
  <script src="js/paginas/carrinho.js"></script>
</body>
</html>
