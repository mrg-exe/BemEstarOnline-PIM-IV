<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produtos | Bem Estar Online</title>
  <meta name="description" content="Catálogo completo da farmácia Bem Estar Online.">
  <link rel="icon" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
  <script>
    // Aplica letra/contraste/tema antes de desenhar a página (evita "piscar").
    try { var p = JSON.parse(localStorage.getItem('beo_acessibilidade') || '{}'), r = document.documentElement;
      if (p.fonte) r.dataset.fonte = p.fonte; if (p.contraste === 'alto') r.dataset.contraste = 'alto';
      if (p.tema && p.tema !== 'auto') r.dataset.tema = p.tema; } catch (e) {}
  </script>
</head>
<body>
  <div id="cabecalho"></div>
  <main id="conteudo" tabindex="-1">

    <div class="conteiner layout-catalogo">
      <aside class="filtros" aria-label="Filtros">
        <fieldset>
          <legend>Categorias</legend>
          <ul class="lista-filtro" id="filtro-categorias"></ul>
        </fieldset>
        <fieldset>
          <legend>Mostrar só</legend>
          <label class="marcar"><input type="checkbox" id="filtro-popular"> Farmácia Popular</label>
          <label class="marcar"><input type="checkbox" id="filtro-continuo"> Uso contínuo</label>
          <label class="marcar"><input type="checkbox" id="filtro-disponiveis"> Disponíveis agora</label>
          <label class="marcar"><input type="checkbox" id="filtro-sem-receita"> Sem receita</label>
        </fieldset>
      </aside>
      <section aria-labelledby="titulo-resultados">
        <div class="barra-resultados">
          <div>
            <h1 id="titulo-resultados">Todos os produtos</h1>
            <p id="contagem" aria-live="polite" style="margin:0;color:var(--tinta-suave)"></p>
          </div>
          <label>Ordenar por
            <select id="ordenar" class="entrada">
              <option value="nome">Nome (A a Z)</option>
              <option value="menor">Menor preço</option>
              <option value="maior">Maior preço</option>
            </select>
          </label>
        </div>
        <ul class="grade-produtos" id="grade"></ul>
      </section>
    </div>
  </main>
  <div id="rodape"></div>
  <script src="js/config.js"></script>
  <script src="js/catalogo-local.js"></script>
  <script src="js/app.js"></script>
  <script src="js/paginas/catalogo.js"></script>
</body>
</html>
