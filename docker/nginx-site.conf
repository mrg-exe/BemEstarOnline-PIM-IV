# Site no Nginx (docker compose, porta 8080).
# Igual à configuração padrão do Nginx, mais o "no-cache": o navegador sempre confere se o
# arquivo mudou, para não mostrar uma versão velha do site depois de uma atualização.
# (A API faz o mesmo quando serve o site em http://localhost:5088.)
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
